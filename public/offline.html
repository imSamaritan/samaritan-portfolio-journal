<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Portfolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="has-background-light">
    <div class="box has-text-centered p-6" style="max-width: 480px;">
        <span class="is-size-1">📡</span>
        <h1 class="title is-3 mt-3">You are offline</h1>
        <p class="subtitle is-6 has-text-grey">
            It looks like your internet connection is lost. Cached pages and journal entries are still accessible.
        </p>
        <button class="button is-primary" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
